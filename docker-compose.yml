services:
  fa-notify:
    build: .
    restart: unless-stopped
    environment:
      FA_NOTIFY_CONFIG: /app/settings.json
    volumes:
      - ./cookies.txt:/app/cookies.txt:ro
      - ./settings.json:/app/settings.json:ro
      - ./notification-state:/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    profiles: [solver]
    restart: unless-stopped
    environment:
      LOG_LEVEL: error
      LOG_HTML: "false"
      DISABLE_MEDIA: "true"
